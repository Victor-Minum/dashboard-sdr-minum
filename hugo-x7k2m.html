<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Minum · Desempenho — Hugo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--dark:#083B31;--mint:#00C896;--med:#0D5C47;--light:#EAF5F1;--card:#C5E8DF;--txt:#1A2E28;--sub:#5C7268;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Calibri,'Segoe UI',Arial,sans-serif;}
body{background:var(--dark);min-height:100vh;color:#fff;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:6px;}
.logo{font-size:26px;font-weight:bold;color:var(--mint);letter-spacing:.5px;}
.logo span{color:#fff;font-weight:normal;}
.sels{display:flex;gap:10px;}
h1{font-size:30px;margin:14px 0 2px;}
h1 em{color:var(--mint);font-style:normal;}
.sub{color:#9dc4b8;font-size:14px;margin-bottom:22px;}
select{background:var(--med);color:#fff;border:1px solid var(--mint);border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--med);border-radius:14px;padding:18px 16px;}
.kpi .v{font-size:30px;font-weight:bold;color:var(--mint);}
.kpi .l{font-size:13px;color:#cfe8df;margin-top:4px;}
.section{background:var(--light);color:var(--txt);border-radius:16px;padding:22px;margin-bottom:22px;}
.section h2{font-size:19px;margin-bottom:14px;color:var(--dark);}
.bonusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.bcard{background:var(--card);border-radius:12px;padding:16px;}
.bcard .t{font-weight:bold;font-size:14px;margin-bottom:8px;}
.bar{background:#fff;border-radius:20px;height:14px;overflow:hidden;margin:8px 0 6px;}
.bar>div{height:100%;background:var(--mint);border-radius:20px;transition:width .4s;}
.small{font-size:12px;color:var(--sub);}
.nivel{font-size:14px;font-weight:bold;color:var(--dark);display:flex;align-items:center;}
.big{font-size:28px;font-weight:bold;color:var(--dark);}
.info{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--dark);color:#fff;font-size:11px;font-weight:bold;cursor:help;position:relative;margin-left:7px;flex-shrink:0;}
.info .tip{visibility:hidden;opacity:0;position:absolute;bottom:135%;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:normal;width:240px;line-height:1.5;z-index:10;transition:opacity .15s;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.info:hover .tip{visibility:visible;opacity:1;}
.total{background:#fff;border-radius:12px;padding:16px;text-align:center;}
canvas{max-height:300px;}
.chart-wrap{background:#fff;border-radius:12px;padding:14px;margin-top:12px;}
footer{color:#6f978a;font-size:12px;text-align:center;margin-top:10px;}

/* ===== NOVA SECAO: ligacoes e atividades ===== */
.ligbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.chips{display:flex;gap:6px;background:#fff;border-radius:10px;padding:4px;}
.chips button{border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:bold;
  padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;}
.chips button:hover{color:var(--dark);}
.chips button.on{background:var(--dark);color:var(--mint);}
.selp{background:#fff;color:var(--txt);border:1px solid #C5E8DF;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr);}}
.tile{background:#fff;border-radius:12px;padding:15px 16px;}
.tile .n{font-size:27px;font-weight:bold;color:var(--dark);line-height:1.1;}
.tile .lb{font-size:12.5px;color:var(--txt);margin-top:3px;font-weight:bold;}
.tile .pd{font-size:16px;font-weight:bold;color:var(--med);margin-top:9px;line-height:1.2;}
.tile .pd span{font-size:11.5px;font-weight:normal;color:var(--sub);display:block;margin-top:1px;}
.metric{margin-bottom:10px;display:inline-flex;}
.nota{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.6;}
@media(max-width:600px){h1{font-size:24px}.kpi .v{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">minum<span> · pré-vendas</span></div>
  <div class="sels">
    <select id="selSdr" style="display:none;"></select>
    <select id="selMes"></select>
  </div>
</header>
<h1 id="titulo"></h1>
<div class="sub" id="subTitulo"></div>

<div class="grid" id="kpis"></div>

<div class="section">
  <h2 id="tituloBonus">Níveis do mês</h2>
  <div class="bonusgrid" id="bonus"></div>
</div>

<div class="section">
  <h2>Histórico</h2>
  <div class="grid" id="totais"></div>
  <div class="chart-wrap"><canvas id="chartRM"></canvas></div>
</div>

<div class="section" id="secLig">
  <h2>Ligações e atividades</h2>

  <div class="ligbar">
    <div class="chips" id="ligGran">
      <button data-g="mes" class="on">Mês</button>
      <button data-g="ano">Ano</button>
    </div>
    <select class="selp" id="ligPeriodo"></select>
  </div>

  <div class="tiles" id="ligTiles"></div>

  <div class="chips metric" id="ligMetric">
    <button data-m="A" class="on">Atividades / Ligações</button>
    <button data-m="B">Ligações (+30s) / Tempo em Linha</button>
  </div>

  <div class="chart-wrap" style="height:320px;"><canvas id="chartLig"></canvas></div>
  <div class="nota" id="ligNota"></div>
</div>

<div class="section">
  <h2>Histórico de contratos</h2>
  <div class="chart-wrap"><canvas id="chartValores"></canvas></div>
  <div class="chart-wrap"><canvas id="chartQtd"></canvas></div>
</div>
<footer id="rodape"></footer>
</div>

const nivelR = n => n>=30?3:n>=20?2:n>=10?1:0;
const nivelV = n => n>=9?3:n>=6?2:n>=3?1:0;
const TIP_R = 'Nível 1: 10 a 19 reuniões → R$250<br>Nível 2: 20 a 29 reuniões → R$750<br>Nível 3: 30 ou mais → R$1.500';
const TIP_V = 'Nível 1: 3 a 5 contratos → R$150<br>Nível 2: 6 a 8 contratos → R$450<br>Nível 3: 9 ou mais → R$900';
const TIP_T = 'Ticket médio até R$3.500 → fator 0,75x<br>R$3.501 a R$4.500 → fator 1,0x<br>Acima de R$4.500 → fator 1,25x<br><br>O fator multiplica o bônus do período.';
const info = tip => `<span class="info">i<span class="tip">${tip}</span></span>`;

function fillMeses(){
  const antes = selMes.value;
  selMes.innerHTML = '';
  vista.serie.forEach(m=>{const o=document.createElement('option');o.value=m.mes;o.textContent=m.label;selMes.appendChild(o);});
  const tem = m => vista.serie.some(x=>x.mes===m);
  selMes.value = tem(antes) ? antes : (tem(D.mes_atual) ? D.mes_atual : vista.serie[vista.serie.length-1].mes);
}

function render(){
  const m = vista.serie.find(x=>x.mes===selMes.value);
  const atual = m.mes === D.mes_atual;
  document.getElementById('titulo').innerHTML = D.vistas.length===1
    ? `Olá, <em>${vista.nome}</em>!`
    : (vista.is_geral ? `Visão <em>Geral</em> do time` : `Visão de <em>${vista.nome}</em>`);
  const kpis = [
    [m.leads,'Leads trabalhados'],[m.reunioes,'Reuniões marcadas'],
    [m.taxa!==null?m.taxa+'%':'—','Taxa de marcação'],[m.atividades,'Atividades (Tentativas de Contato)'],
    [m.assinados,'Contratos assinados'],[fmtBRL(m.valor_assinado),'Valor contratos assinados'],
    [m.validados,'Contratos validados'],[fmtBRL(m.valor_validado),'Valor contratos validados'],
  ];
  document.getElementById('kpis').innerHTML = kpis.map(([v,l])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('subTitulo').textContent = `Resultados de ${m.label} · atualizado em ${D.gerado_em}`;
  document.getElementById('tituloBonus').textContent = (atual?'Bonificação — ':'Níveis — ')+m.label;

  const fatorTxt = m.fator ? m.fator.toLocaleString('pt-BR')+'x' : '—';
  const ticketTxt = m.ticket ? fmtBRL2(m.ticket) : '—';
  const obsTicket = atual ? '' : `<div class="small" style="margin-top:6px;">Este valor pode ter sido alterado em relação ao valor do seu relatório de bonificação oficial recebido por e-mail.</div>`;
  let html = '';
  if (!vista.is_geral){
    const pR = Math.min(100, m.reunioes/30*100), pF = Math.min(100, m.validados/9*100);
    html += `
    <div class="bcard"><div class="t">Reuniões marcadas: ${m.reunioes}</div>
      <div class="bar"><div style="width:${pR}%"></div></div>
      <div class="nivel">Nível ${nivelR(m.reunioes)} alcançado ${info(TIP_R)}</div></div>
    <div class="bcard"><div class="t">Contratos validados: ${m.validados}</div>
      <div class="bar"><div style="width:${pF}%"></div></div>
      <div class="nivel">Nível ${nivelV(m.validados)} alcançado ${info(TIP_V)}</div></div>
    <div class="bcard"><div class="t">Ticket médio das reuniões</div>
      <div class="big">${ticketTxt}</div>
      <div class="nivel">Fator: ${fatorTxt} ${info(TIP_T)}</div>${obsTicket}</div>`;
    if (atual) html += `
    <div class="bcard" style="background:var(--dark);color:#fff;"><div class="t" style="color:var(--mint);">Bônus do mês (parcial)</div>
      <div class="big" style="color:var(--mint);">${fmtBRL2(m.bonus)}</div>
      <div class="small" style="color:#9dc4b8;">(R$${m.bonus_reunioes} reuniões + R$${m.bonus_fechamentos} contratos validados) × ${fatorTxt}</div></div>`;
  } else {
    html += `
    <div class="bcard"><div class="t">Ticket médio das reuniões (time)</div>
      <div class="big">${ticketTxt}</div>${obsTicket}</div>`;
    if (atual) html += `
    <div class="bcard" style="background:var(--dark);color:#fff;"><div class="t" style="color:var(--mint);">Bônus do time no mês (parcial)</div>
      <div class="big" style="color:var(--mint);">${fmtBRL2(m.bonus)}</div>
      <div class="small" style="color:#9dc4b8;">Soma dos bônus parciais individuais dos SDRs</div></div>`;
  }
  document.getElementById('bonus').innerHTML = html;

  const T = vista.totais;
  document.getElementById('totais').innerHTML = [
    [T.leads,'Leads trabalhados (total)'],[T.reunioes,'Reuniões marcadas (total)'],
    [T.taxa!==null?T.taxa+'%':'—','Taxa de marcação média'],[T.atividades,'Atividades (Tentativas de Contato) (total)'],
    [T.assinados,'Contratos assinados (total)'],[fmtBRL(T.valor_assinado),'Valor contratos assinados (total)'],
    [T.validados,'Contratos validados (total)'],[fmtBRL(T.valor_validado),'Valor contratos validados (total)'],
  ].map(([v,l])=>`<div class="total"><div class="big" style="font-size:22px;">${v}</div><div class="small">${l}</div></div>`).join('');
}

function renderCharts(){
  charts.forEach(c=>c.destroy()); charts = [];

  charts.push(new Chart(document.getElementById('chartRM'),{type:'bar',

      if(!set.has(k)) set.set(k,{id:k,label:MESES_L[+k.slice(5,7)-1]+'/'+k.slice(0,4)});});
  } else {
    S.forEach(r=>{const k=r[0].slice(0,4); if(!set.has(k)) set.set(k,{id:k,label:'Ano de '+k});});
  }
  return [...set.values()].reverse();
}

function baldes(pid){
  /* dias_ati / dias_lig contam os dias COM registro de cada fonte — as ligações
     só existem a partir de mai/2026, então a média por dia não pode dividir
     pelos dias em que só havia atividade. */
  const S = vista.serie_diaria||[];
  if(gran==='mes'){
    return S.filter(r=>r[0].slice(0,7)===pid)
            .map(r=>({lab:String(+r[0].slice(8,10)),ati:r[1],lig:r[2],cnv:r[3],min:r[4],
                      dias_ati:r[1]>0?1:0, dias_lig:r[2]>0?1:0}));
  }
  const acc={};
  S.filter(r=>r[0].slice(0,4)===pid).forEach(r=>{
    const m=+r[0].slice(5,7)-1;
    acc[m]=acc[m]||{lab:MESES_L[m],ati:0,lig:0,cnv:0,min:0,dias_ati:0,dias_lig:0};
    acc[m].ati+=r[1];acc[m].lig+=r[2];acc[m].cnv+=r[3];acc[m].min+=r[4];
    if(r[1]>0) acc[m].dias_ati++; if(r[2]>0) acc[m].dias_lig++;});
  return Object.keys(acc).sort((a,b)=>a-b).map(k=>acc[k]);
}
const soma = (bs,m)=>bs.reduce((a,b)=>a+b[m],0);

function renderLig(){
  const sel=document.getElementById('ligPeriodo');
  const bs=baldes(sel.value);

  document.getElementById('ligTiles').innerHTML = ['ati','lig','cnv','min'].map(m=>{
    /* a media por dia divide pelos dias em que AQUELA metrica tem registro:
       ligacoes so existem a partir de mai/2026, entao dividir por todos os dias
       do periodo achataria o numero sem motivo */
    const tot=soma(bs,m);
    const base = soma(bs, m==='ati' ? 'dias_ati' : 'dias_lig');
    const med = base ? tot/base : 0;
    const pd = m==='min' ? br(Math.round(med))+' min' : br(med, med<10?1:0);
    return `<div class="tile"><div class="n">${fmtVal(tot,m)}</div>
            <div class="lb">${MET[m].nome}</div>
            <div class="pd">${pd}<span>por dia</span></div></div>`;
  }).join('');

  const ids=PARES[par].ids, labels=bs.map(b=>b.lab);
  const eixos=['y','y1'];
  const ds=ids.map((m,i)=>({label:MET[m].nome,data:bs.map(b=>b[m]),backgroundColor:MET[m].cor,
    borderRadius:4,maxBarThickness:34,categoryPercentage:.76,barPercentage:.9,
    yAxisID:eixos[i],__m:m}));

  if(chartLig) chartLig.destroy();
  chartLig=new Chart(document.getElementById('chartLig'),{type:'bar',data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',labels:{boxWidth:12,boxHeight:12,color:'#1A2E28',
                font:{size:13,weight:'bold'},usePointStyle:false,padding:16}},
        title:{display:true,text:PARES[par].titulo+' por '+(gran==='ano'?'mês':'dia'),
               color:'#083B31',font:{size:14,weight:'bold'},padding:{bottom:12}},
        tooltip:{backgroundColor:'#083B31',padding:10,
          callbacks:{label:c=>' '+c.dataset.label+': '+fmtVal(c.parsed.y,c.dataset.__m)}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#5C7268'},border:{color:'#D8E9E2'}},
        y:{position:'left',beginAtZero:true,grid:{color:'#E9F2EE'},border:{display:false},
           ticks:{color:MET[ids[0]].cor,font:{weight:'bold'},precision:0,callback:v=>br(v)},
           title:{display:true,text:MET[ids[0]].nome,color:MET[ids[0]].cor,font:{size:12,weight:'bold'}}},
        y1:{position:'right',beginAtZero:true,grid:{display:false},border:{display:false},
           ticks:{color:MET[ids[1]].cor2||MET[ids[1]].cor,font:{weight:'bold'},precision:0,
                  callback:v=>br(v)},
           title:{display:true,text:MET[ids[1]].nome,color:MET[ids[1]].cor2||MET[ids[1]].cor,
                  font:{size:12,weight:'bold'}}}}}});

  document.getElementById('ligNota').innerHTML =
    '<b>Atividades</b>: tentativas de contato registradas no CRM, sem duplicata do mesmo lead em menos de 60s. &nbsp;·&nbsp; '+
    '<b>Ligações</b>: discagens agrupadas por chamada, descartando as em formato inválido. &nbsp;·&nbsp; '+
    '<b>Ligações (+30s)</b>: atendidas com 30 segundos ou mais de conversa. &nbsp;·&nbsp; '+
    '<b>Tempo em Linha</b>: minutos efetivamente falados.<br>'+
    (D.ligacoes_ate?'':'') + 'Cada barra tem sua própria escala — a da esquerda vale para '+MET[PARES[par].ids[0]].nome+
    ' e a da direita para '+MET[PARES[par].ids[1]].nome+'; compare cada série com ela mesma ao longo dos dias, não a altura de uma com a da outra. '+
    'Clique na legenda para tirar uma das barras da análise.' +
    (D.ligacoes_ate ? ' Ligações atualizadas até <b>'+D.ligacoes_ate+'</b>.' : '');
}

function temLigacoes(){ return (vista.serie_diaria||[]).length>0; }

function fillPeriodos(){
  const sel=document.getElementById('ligPeriodo'), P=periodos();
  sel.innerHTML=''; P.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.label;sel.appendChild(o);});
  if(P.length) sel.value=P[0].id;
}
document.getElementById('ligGran').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  gran=b.dataset.g; fillPeriodos(); renderLig();});
document.getElementById('ligMetric').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  par=b.dataset.m; renderLig();});
document.getElementById('ligPeriodo').addEventListener('change',renderLig);
function atualizaLig(){
  const sec=document.getElementById('secLig');
  if(!temLigacoes()){ sec.style.display='none'; return; }
  sec.style.display=''; fillPeriodos(); renderLig();
  sincronizaComMesGeral();   /* nasce no mesmo mês do seletor do topo */
}

/* Quando o seletor de mês do topo (visão geral da página) muda, a seção de
   ligações acompanha. Não é vínculo travado: mexer no seletor da seção não
   mexe no resto da página, e um mês sem ligações não move nada. */
function sincronizaComMesGeral(){
  if(!temLigacoes()) return;
  const alvo = selMes.value;
  if(!(vista.serie_diaria||[]).some(r=>r[0].slice(0,7)===alvo)) return;
  if(gran!=='mes'){
    gran='mes';
    [...document.getElementById('ligGran').children]
      .forEach(b=>b.classList.toggle('on', b.dataset.g==='mes'));
    fillPeriodos();
  }
  document.getElementById('ligPeriodo').value = alvo;
  renderLig();
}
selMes.addEventListener('change', sincronizaComMesGeral);
atualizaLig();

document.getElementById('rodape').textContent = `Dados: tabela-mestre Odoo + Onboarding · gerado em ${D.gerado_em}`;
</script>
</body>
